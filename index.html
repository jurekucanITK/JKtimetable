<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151618" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="JKtimetable">
  <title>JKtimetable</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
  <link rel="icon" href="icons/icon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png?v=2" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="timetable-view">
    <header class="top">
      <button id="prev" class="icon-btn" aria-label="Prejšnji teden">‹</button>
      <button id="title" class="title" aria-label="Na današnji teden">
        <span id="week-label">JKtimetable</span>
        <small id="week-sub"></small>
      </button>
      <button id="next" class="icon-btn" aria-label="Naslednji teden">›</button>
      <button id="exams-btn" class="icon-btn" aria-label="Kolokviji">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/></svg>
      </button>
      <button id="settings-btn" class="icon-btn" aria-label="Nastavitve">⚙︎</button>
    </header>

    <main id="week" class="week" aria-live="polite"></main>
    <p id="status" class="status"></p>
  </div>

  <!-- Kolokviji -->
  <div id="exams-view" hidden>
    <header class="top">
      <button id="exams-back" class="icon-btn" aria-label="Nazaj na urnik">‹</button>
      <div class="title">
        <span>Kolokviji</span>
        <small id="exams-sub"></small>
      </div>
      <button id="exam-add" class="icon-btn" aria-label="Dodaj kolokvij">+</button>
    </header>
    <main class="page-body">
      <div id="exam-list"></div>
    </main>
  </div>

  <!-- Urejanje kolokvija -->
  <dialog id="exam-edit" class="sheet">
    <form id="exam-form">
      <div class="sheet-head">
        <strong id="exam-edit-title">Nov kolokvij</strong>
        <button type="button" id="exam-close" class="close" aria-label="Zapri">✕</button>
      </div>
      <label class="field"><span>Predmet</span><select id="ex-subject"></select></label>
      <label class="field"><span>Naziv</span><input id="ex-title" type="text" placeholder="npr. 1. kolokvij"></label>
      <label class="field"><span>Datum</span><input id="ex-date" type="date" required></label>
      <div class="form-actions">
        <button type="button" id="ex-delete" class="btn danger">Izbriši</button>
        <button type="submit" class="btn primary">Shrani</button>
      </div>
    </form>
  </dialog>

  <!-- Podrobnosti dogodka -->
  <dialog id="detail" class="sheet">
    <form method="dialog">
      <div class="sheet-head">
        <span id="d-type" class="pill"></span>
        <button class="close" aria-label="Zapri">✕</button>
      </div>
      <h2 id="d-title"></h2>
      <dl>
        <dt>Čas</dt><dd id="d-time"></dd>
        <dt>Prostor</dt><dd id="d-room"></dd>
        <dt>Izvajalci</dt><dd id="d-who"></dd>
        <dt>Skupine</dt><dd id="d-groups"></dd>
      </dl>
    </form>
  </dialog>

  <!-- Nastavitve -->
  <dialog id="settings" class="sheet">
    <form method="dialog">
      <div class="sheet-head">
        <strong>Moje skupine</strong>
        <button class="close" aria-label="Zapri">✕</button>
      </div>
      <p class="hint">Predavanja so vedno prikazana. Pri vajah izberi svojo skupino.</p>
      <div id="subject-list"></div>
      <label class="row toggle">
        <span>Prikaži rezervacije</span>
        <input type="checkbox" id="show-res">
      </label>
      <label class="row toggle">
        <span>Prikaži vikend</span>
        <input type="checkbox" id="show-weekend">
      </label>
      <p id="updated" class="hint"></p>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
